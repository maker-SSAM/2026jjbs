<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>부설초등학교 교사연수 · 무한상상실 기기 활용법</title>
<meta name="description" content="3D프린터·레이저커터·승화전사기·버튼만들기 — 작동원리, 연수자료, 기기작동 매뉴얼.">
<script>
/* 예전 주소(index.html#3d 등, 예전 QR)는 그 기기 매뉴얼로 보낸다 */
(function () {
  function old() { var h = location.hash.slice(1); if (/^(3d|laser|mug|button)$/.test(h)) location.replace(h + '/manual.html'); }
  old(); addEventListener('hashchange', old);
})();
</script>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 메인 슬라이드: 큰 화면에서는 16:9 강의 표지처럼(글자·버튼이 화면 폭에 맞춰 커짐), 휴대폰에서는 제목 아래 버튼이 세로로.
   색·글꼴은 강의 덱(Lecture-Notes DESIGN.md)과 같게: 검은 무대, 행동 파랑 하나, 기기 색은 그 기기에만. */
:root{
  color-scheme:dark;
  --stage:#000; --ink:#f5f5f7; --ink-2:#a1a1a6; --card:#272729; --card-hover:#333337;
  --action:#2997ff;
  --d0:#a1a1a6; --d1:#4FA3FF; --d2:#FF7A45; --d3:#C77DFF; --d4:#4CD07D;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased}
.page{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:5vw 6.25vw}
.eyebrow{margin:0;font-size:max(15px,1.56vw);font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
h1{margin:.3em 0 0;font-size:max(34px,6.25vw);line-height:1.12;font-weight:700;letter-spacing:-.025em}
.sub{margin:.45em 0 0;font-size:max(20px,2.6vw);font-weight:500;color:var(--ink-2)}
.go{list-style:none;margin:max(28px,5.2vw) 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:max(10px,1.25vw)}
.go a{display:flex;flex-direction:column;justify-content:space-between;gap:max(14px,1.5vw);height:100%;min-height:max(120px,13vw);
  padding:max(16px,1.7vw);border-radius:max(16px,1.46vw);background:var(--card);color:var(--ink);text-decoration:none;
  transition:background .15s,transform .15s}
.go a:hover{background:var(--card-hover);transform:translateY(-4px)}
.go a:focus-visible{outline:3px solid var(--action);outline-offset:3px}
.go .n{display:grid;place-items:center;width:max(40px,3.4vw);aspect-ratio:1;border-radius:50%;background:var(--c);color:#000;font-size:max(18px,1.6vw);font-weight:800}
.go .t{display:block;font-size:max(19px,2vw);font-weight:700;line-height:1.25;letter-spacing:-.01em}
.go .t small{display:block;margin-top:.35em;font-size:max(13px,.62em);font-weight:500;color:var(--ink-2)}
@media (max-width:820px){
  .page{justify-content:flex-start;padding:48px 16px 32px}
  .go{grid-template-columns:1fr;gap:10px}
  .go a{flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;min-height:0;padding:16px}
  .go .n{flex:none}
}
</style>
</head>
<body>
<main class="page">
  <p class="eyebrow">무한상상실(메이커 교실)</p>
  <h1>부설초등학교 교사연수</h1>
  <p class="sub">- 무한상상실 기기 활용법</p>
  <ol class="go" aria-label="바로 가기">
    <li><a href="link.html" style="--c:var(--d0)"><span class="n">0</span><span class="t">0. 접속링크<small>사이트 주소 · QR</small></span></a></li>
    <li><a href="3d/" style="--c:var(--d1)"><span class="n">1</span><span class="t">1. 3D프린터<small>큐비콘 Style Plus</small></span></a></li>
    <li><a href="laser/" style="--c:var(--d2)"><span class="n">2</span><span class="t">2. 레이저커터<small>데이비드레이저 DV-7045</small></span></a></li>
    <li><a href="mug/" style="--c:var(--d3)"><span class="n">3</span><span class="t">3. 승화전사기<small>머그 프레스 5구</small></span></a></li>
    <li><a href="button/" style="--c:var(--d4)"><span class="n">4</span><span class="t">4. 버튼만들기<small>버튼제작기</small></span></a></li>
  </ol>
</main>
<script>
/* 발표할 때 숫자 키 0~4로 바로 가기 */
addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var a = document.querySelectorAll('.go a')[+e.key];
  if (/^[0-4]$/.test(e.key) && a) location.href = a.href;
});
</script>

</body>
</html>
