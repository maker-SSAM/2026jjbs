<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="deck-home" content="./">
<title>0. 접속링크 · 무한상상실 기기 활용법</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/deck/core.css">
<link rel="stylesheet" href="assets/deck/jjbs.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/deck/core.js"></script>
<script src="assets/deck/objects.js"></script>
</head>
<body class="d-link">
<div id="viewport">
  <div id="stage">

<section class="slide" id="c_link" data-tile="black" data-title="0. 접속링크"
  data-notes="휴대폰 카메라로 QR을 찍거나 bit.ly/2026부설연수 를 입력하면 이 사이트가 열립니다.">
  <div class="abs h2" style="left:100px;top:84px">0. 접속링크</div>
  <div class="qrbox abs" style="left:712px;top:224px;padding:24px"><div data-qr="https://maker-ssam.github.io/2026jjbs/" data-size="448"></div></div>
  <!-- 짧은 주소(bit.ly → 이 사이트). 글자 크기는 아래 fit()이 무대 폭에 맞춰 한 줄로 최대한 키운다 -->
  <div class="abs lk-url" style="left:100px;top:730px;width:1720px;height:300px"><span>bit.ly/2026부설연수</span></div>
</section>

<section class="slide" id="c_padlet" data-tile="black" data-title="0. 접속링크 · 패들렛"
  data-notes="두 번째 주소는 패들렛입니다. 휴대폰 카메라로 QR을 찍거나 bit.ly/전북메이커 를 입력하면 열립니다.">
  <div class="abs h2" style="left:100px;top:84px">0. 접속링크 · 패들렛</div>
  <!-- 단축 주소만 적는다(패들렛 원래 주소에는 계정 아이디가 들어 있음) -->
  <div class="qrbox abs" style="left:712px;top:224px;padding:24px"><div data-qr="https://bit.ly/%EC%A0%84%EB%B6%81%EB%A9%94%EC%9D%B4%EC%BB%A4" data-size="448"></div></div>
  <a class="abs lk-url" href="https://bit.ly/%EC%A0%84%EB%B6%81%EB%A9%94%EC%9D%B4%EC%BB%A4" target="_blank" rel="noopener" style="left:100px;top:730px;width:1720px;height:300px"><span>bit.ly/전북메이커</span></a>
</section>
<style>
.lk-url{display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--action-dark)}
</style>
<script>
(function () {
  /* 주소가 줄바꿈 없이 1720×300 칸을 가득 채우는 가장 큰 글자 크기 */
  function fit() {
    document.querySelectorAll('.lk-url').forEach(el => {
      const old = el.style.fontSize;
      el.style.fontSize = '100px';
      const w = el.firstElementChild.offsetWidth;   /* 무대 배율과 상관없는 글자 폭. 안 보이는 장은 0 */
      el.style.fontSize = w ? Math.floor(Math.min(1720 * 100 / w, 280)) + 'px' : old;
    });
  }
  Deck.scene('c_link', { enter: fit });
  Deck.scene('c_padlet', { enter: fit });
  if (document.fonts) document.fonts.ready.then(fit);
})();
</script>

  </div>
</div>
<script src="assets/deck/jjbs.js"></script>
<script>JJ.start();</script>

</html>
