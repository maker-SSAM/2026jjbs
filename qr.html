<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기기 옆 QR 붙임 종이 · 무한상상실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .qr {
    background: #fff; color: #111; border: 3px solid var(--dev); border-radius: 14px;
    padding: 16px; text-align: center; break-inside: avoid;
  }
  .qr h2 { margin: 0; font-size: 1.5em; color: var(--dev); }
  .qr p { margin: 4px 0 10px; font-size: .9em; color: #444; }
  .qr .code { display: flex; justify-content: center; }
  .qr .code img, .qr .code canvas { width: 160px; height: 160px; }
  .qr small { display: block; margin-top: 8px; color: #666; word-break: break-all; }
  @media (max-width: 480px) { .sheet { grid-template-columns: 1fr; } }
  @media print {
    @page { size: A4; margin: 12mm; }
    .wrap { max-width: none; padding: 0; }
    .sheet { gap: 10mm; }
    .qr { min-height: 120mm; display: flex; flex-direction: column; justify-content: center; }
    .qr .code img, .qr .code canvas { width: 55mm; height: 55mm; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="noprint">
    <a class="back" href="./">← 메인으로</a>
    <header class="top">
      <h1>기기 옆 QR 붙임 종이</h1>
      <p>A4로 인쇄해 잘라서 기기 옆에 붙이세요. 휴대폰으로 찍으면 그 기기 매뉴얼이 바로 열려요.</p>
    </header>
    <p><button class="btn" onclick="print()">인쇄하기</button></p>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<script>
const BASE = 'https://maker-ssam.github.io/2026jjbs/';
const DEVICES = [
  { id: '3d', name: '3D프린터', color: 'var(--c3d)' },
  { id: 'laser', name: '레이저커터', color: 'var(--claser)' },
  { id: 'mug', name: '승화전사기', color: 'var(--cmug)' },
  { id: 'button', name: '버튼만들기', color: 'var(--cbutton)' }
];
for (const d of DEVICES) {
  const url = BASE + d.id + '/manual.html';
  const box = document.createElement('div');
  box.className = 'qr';
  box.style.setProperty('--dev', d.color);
  box.innerHTML = `<h2>${d.name}</h2><p>기기작동 매뉴얼 · 안전 수칙 · 문제 해결</p><div class="code"></div><small>${url}</small>`;
  document.getElementById('sheet').append(box);
  new QRCode(box.querySelector('.code'), { text: url, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
}
</script>

</body>
</html>
